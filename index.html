<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent 9-Box Dashboard (全自動分頁連動)</title>
<style>
  :root{
    --surface-1: #fcfcfb; --page-plane: #f9f9f7; --text-primary: #0b0b0b; --text-secondary: #52514e;
    --text-muted: #898781; --gridline: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-3: #1baf7a; --series-6: #008300; --good: #0ca30c;
    --warning: #fab219; --critical: #d03b3b; --card-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7;
      --text-muted: #898781; --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --card-bg: #232322;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page-plane); color:var(--text-primary); font-family:system-ui, -apple-system, sans-serif; font-size:14px; line-height:1.5; padding:24px 20px;}
  .wrap{max-width:1200px; margin:0 auto;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  h1{font-size:20px; margin:0;}
  .sync-btn{background:var(--series-1); color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600;}
  .sync-btn:hover{opacity:0.9;}

  /* 動態 Tab 列 */
  .tab-bar{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--gridline); padding-bottom:8px; overflow-x:auto;}
  .tab-btn{background:none; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; color:var(--text-secondary); font-weight:600; font-size:13px;}
  .tab-btn:hover{background:var(--border);}
  .tab-btn.active{background:var(--text-primary); color:var(--surface-1);}

  /* KPI */
  .kpi-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px;}
  .kpi{background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .kpi .label{font-size:11px; color:var(--text-muted); text-transform:uppercase;}
  .kpi .value{font-size:24px; font-weight:700; margin-top:2px;}
  .kpi.good .value{color:var(--good);} .kpi.crit .value{color:var(--critical);}

  /* 9-Box Grid */
  .box-grid-wrap{display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; margin-bottom:28px;}
  .box-grid{display:grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3,1fr); gap:2px; background:var(--gridline); border:1px solid var(--border); border-radius:8px; overflow:hidden; aspect-ratio: 1.35 / 1;}
  .cell{background:var(--card-bg); padding:10px; display:flex; flex-direction:column; justify-content:space-between;}
  .cell .name{font-size:11px; font-weight:600; color:var(--text-secondary);}
  .cell .count{font-size:22px; font-weight:700;}
  .cell .pool{font-size:10px; font-weight:600;}
  .cell.tone-good{box-shadow:inset 3px 0 0 var(--good);}
  .cell.tone-growth{box-shadow:inset 3px 0 0 var(--series-3);}
  .cell.tone-maintain{box-shadow:inset 3px 0 0 var(--baseline);}
  .cell.tone-warn{box-shadow:inset 3px 0 0 var(--warning);}
  .cell.tone-crit{box-shadow:inset 3px 0 0 var(--critical); background: color-mix(in srgb, var(--critical) 7%, var(--card-bg));}

  .grid-with-axes{display:grid; grid-template-columns:18px 1fr; gap:6px;}
  .axis-label-y{writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; color:var(--text-muted); font-size:11px; font-weight:600;}
  .x-labels{display:grid; grid-template-columns:repeat(3,1fr); text-align:center; color:var(--text-muted); font-size:11px; font-weight:600; margin-top:4px;}

  .side-card{background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:14px;}
  .side-card h3{font-size:11.5px; margin:0 0 8px; color:var(--text-secondary); text-transform:uppercase;}
  .bar-row{display:grid; grid-template-columns:60px 1fr 28px; align-items:center; gap:6px; margin-bottom:4px; font-size:11px;}
  .bar-track{height:6px; background:var(--gridline); border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--series-1);}

  /* 表格 */
  table{width:100%; border-collapse:collapse; font-size:12px; background:var(--card-bg); border-radius:8px; overflow:hidden; border:1px solid var(--border); margin-bottom:28px;}
  thead th{text-align:left; padding:8px 10px; background:var(--page-plane); color:var(--text-muted); font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--border);}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--gridline);}
  .pill{display:inline-block; padding:2px 6px; border-radius:12px; font-size:10px; font-weight:700;}
  .pill.b1{background:#dcfce7; color:#166534;}
  .pill.b2,.pill.b4{background:#e0e7ff; color:#3730a3;}
  .pill.b3{background:#fef3c7; color:#92400e;}
  .pill.b9,.pill.b6{background:#fee2e2; color:#991b1b;}
  .pill.b5{background:#f1f5f9; color:#475569;}

  /* Playbook 卡片 */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .pcard{background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:14px; font-size:12px;}
  .pcard.crit{border-color:color-mix(in srgb, var(--critical) 40%, var(--border));}
  .pcard blockquote{margin:4px 0; padding:6px 8px; background:var(--page-plane); border-left:3px solid var(--series-1); font-size:11.5px;}
  .pcard.crit blockquote{border-left-color:var(--critical);}
  .jrisk{margin-top:6px; padding:6px 8px; border-radius:4px; font-size:11px; background:#fff7ed; color:#9a3412;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>人才盤點與 2027/04 晉升儀表板</h1>
      <div id="status" style="font-size:12px; color:var(--text-muted); margin-top:2px;">連線中...</div>
    </div>
    <button class="sync-btn" onclick="initDashboard()">重新同步試算表目錄</button>
  </header>

  <!-- 自動長出的部門分頁按鈕 -->
  <div class="tab-bar" id="deptTabs"></div>

  <!-- KPI -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- 九宮格 -->
  <div class="box-grid-wrap">
    <div>
      <div class="grid-with-axes">
        <div class="axis-label-y">POTENTIAL →</div>
        <div class="box-grid" id="boxGrid"></div>
      </div>
      <div style="display:grid; grid-template-columns:18px 1fr; gap:6px;">
        <div></div>
        <div class="x-labels"><div>Low</div><div>Medium</div><div>High</div></div>
      </div>
      <div style="text-align:center; color:var(--text-muted); font-size:10.5px; font-weight:600; margin-top:2px;">PERFORMANCE →</div>
    </div>
    <div class="side-card" id="sideMetrics"></div>
  </div>

  <!-- 員工名單 -->
  <table>
    <thead>
      <tr>
        <th>ID</th><th>姓名</th><th>職階</th><th>地區</th><th>績效均分</th><th>加權潛力</th><th>九宮格落點</th><th>明年4月處置 / 晉升Pool</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Playbook -->
  <h3 style="font-size:13px; margin:0 0 10px 0; text-transform:uppercase;">高潛留才與合規處置 (Playbook)</h3>
  <div class="cards" id="playbookCards"></div>
</div>

<script>
// 基礎發布路徑
const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGPWPZC10sDW7DNW_X21iuKxKNwGhmERDWdBI8RdXPBjunnRelJtf9I2PYPzSBE80EvHrgyLgyWs8C/pub?output=csv&single=true&gid=";

// 預設第一個頁面 (Fiat) 的 GID，確保初次載入一定成功
const DEFAULT_FIAT_GID = "1952213325";

let deptList = [];
let currentDept = null;
let currentData = [];

const perfMap = { "S": 5.0, "A": 4.0, "B": 3.0, "B-": 2.0, "C": 1.0 };
const potMap = { "高": 5.0, "中": 3.0, "低": 1.5, "HIGH": 5.0, "MED": 3.0, "LOW": 1.5 };

const complianceGuidelines = {
  TW: "【台灣 勞基法】第 11 條第 5 款最後手段性原則，需實施 2-4 週 PIP 明確量化指標並留存輔導轉崗紀錄。",
  SG: "【新加坡 TAFEP】2-4 週 PIP 需有每週檢視紀錄，未達標給予法定預告期或代通知金。",
  MY: "【馬來西亞 工業關係法】需寄送至少兩次正式書面警告信（Warning Letter）並保留輔導日誌。",
  US: "【美國 At-Will】以書面 PIP 載明客觀是非標準，作為抗辯 Title VII / ADEA 之佐證。",
  EU: "【歐盟 嚴格保護】2-4 週改善難被法院採納，強烈建議採協議離職（Mutual Separation）。",
  UAE: "【阿聯酋 勞工法】需有明確業績考核記錄，並提供至少 30 天法定預告期。",
  IN: "【印度 勞動法】需保留書面輔導記錄並給予通知工資折算。"
};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^[\uFEFF\s]+|[\s]+$/g, ''));
  return lines.slice(1).map(line => {
    const values = line.split(',').map(v => v.trim());
    let obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

function processRow(row) {
  const q1 = perfMap[String(row.Q1).trim().toUpperCase()] || parseFloat(row.Q1) || 0;
  const q2 = perfMap[String(row.Q2).trim().toUpperCase()] || parseFloat(row.Q2) || 0;
  const q3 = perfMap[String(row.Q3).trim().toUpperCase()] || parseFloat(row.Q3) || 0;
  const q4 = perfMap[String(row.Q4).trim().toUpperCase()] || parseFloat(row.Q4) || 0;
  const perf = (q1 + q2 + q3 + q4) / 4;

  const leadRaw = row.Manager_Pot || row.Lead_Pot || "中";
  const headRaw = row.HRBP_Pot || row.Head_Pot || "中";
  const leadPot = potMap[String(leadRaw).trim()] || parseFloat(leadRaw) || 3.0;
  const headPot = potMap[String(headRaw).trim()] || parseFloat(headRaw) || 3.0;
  const pot = (leadPot * 0.7) + (headPot * 0.3);

  let perfTier = perf >= 4.2 ? 'High' : (perf >= 3.0 ? 'Med' : 'Low');
  let potTier = pot >= 4.0 ? 'High' : (pot >= 2.8 ? 'Med' : 'Low');
  let box = '', boxLabel = '', pool = '';

  if (perfTier === 'High' && potTier === 'High') { box = 'Box 1'; boxLabel = 'Box 1 (Star)'; pool = 'Fast-Track 優先晉升'; }
  else if (perfTier === 'Med' && potTier === 'High') { box = 'Box 2'; boxLabel = 'Box 2 (High Potential)'; pool = 'Succession 儲備 (6-12mo)'; }
  else if (perfTier === 'Low' && potTier === 'High') { box = 'Box 3'; boxLabel = 'Box 3 (Rough Diamond)'; pool = '關注調崗 / 潛力激發'; }
  else if (perfTier === 'High' && potTier === 'Med') { box = 'Box 4'; boxLabel = 'Box 4 (High Performer)'; pool = 'Succession 儲備 (6-12mo)'; }
  else if (perfTier === 'Med' && potTier === 'Med') { box = 'Box 5'; boxLabel = 'Box 5 (Core Player)'; pool = '維持現職深耕'; }
  else if (perfTier === 'Low' && potTier === 'Med') { box = 'Box 6'; boxLabel = 'Box 6 (Dilemma)'; pool = '限期觀察 / 雙週輔導'; }
  else if (perfTier === 'High' && potTier === 'Low') { box = 'Box 7'; boxLabel = 'Box 7 (Solid Pro)'; pool = '資深專家 (不轉管理)'; }
  else if (perfTier === 'Med' && potTier === 'Low') { box = 'Box 8'; boxLabel = 'Box 8 (Effective)'; pool = '標準維持者'; }
  else { box = 'Box 9'; boxLabel = 'Box 9 (Underperformer)'; pool = '啟動 2-4 週 PIP'; }

  return {
    id: row.Employee_ID || '',
    name: row.Name || '',
    level: row.Current_Level || '',
    loc: (row.Location || row.Region || '').toUpperCase(),
    perf: Number(perf.toFixed(2)),
    pot: Number(pot.toFixed(2)),
    box, boxLabel, pool,
    notes: row.Notes || ''
  };
}

// 核心：嘗試抓取 Index 分頁；如果還沒建 Index，自動 fallback 預設的 Fiat
function initDashboard() {
  const status = document.getElementById('status');
  status.innerText = "讀取目錄分頁中...";

  // 嘗試讀取 Index 分頁 (預設 gid=0 或透過預設名單)
  fetch(BASE_URL + "0")
    .then(res => res.text())
    .then(csv => {
      const rows = parseCSV(csv);
      // 判斷第 1 欄是否為 Department
      if (rows.length > 0 && rows[0].Department && rows[0].GID) {
        deptList = rows.map(r => ({ name: r.Department, gid: r.GID }));
      } else {
        throw new Error("尚未設定 Index 分頁");
      }
      buildDeptTabs();
    })
    .catch(() => {
      // 若沒有建 Index，預設直接載入 Fiat
      deptList = [
        { name: "法幣部門 (Fiat)", gid: DEFAULT_FIAT_GID }
      ];
      buildDeptTabs();
    });
}

function buildDeptTabs() {
  const container = document.getElementById('deptTabs');
  container.innerHTML = '';
  if (!currentDept || !deptList.some(d => d.name === currentDept.name)) {
    currentDept = deptList[0];
  }

  deptList.forEach(dept => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${dept.name === currentDept.name ? 'active' : ''}`;
    btn.innerText = dept.name;
    btn.onclick = () => {
      currentDept = dept;
      buildDeptTabs();
      loadCurrentDeptData();
    };
    container.appendChild(btn);
  });

  loadCurrentDeptData();
}

function loadCurrentDeptData() {
  const status = document.getElementById('status');
  status.innerText = `載入 ${currentDept.name} 中...`;

  fetch(BASE_URL + currentDept.gid)
    .then(res => res.text())
    .then(csv => {
      currentData = parseCSV(csv).map(processRow);
      status.innerText = `已同步 ${currentDept.name} 共 ${currentData.length} 筆資料 (${new Date().toLocaleTimeString()})`;
      renderUI();
    })
    .catch(err => {
      status.innerText = "載入失敗: " + err.message;
    });
}

function renderUI() {
  const list = currentData;

  // KPIs
  const total = list.length;
  const b1 = list.filter(e => e.box === 'Box 1').length;
  const growth = list.filter(e => e.box === 'Box 2' || e.box === 'Box 4').length;
  const core = list.filter(e => e.box === 'Box 5' || e.box === 'Box 7' || e.box === 'Box 8').length;
  const pip = list.filter(e => e.box === 'Box 9' || e.box === 'Box 6').length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi"><div class="label">部門人數</div><div class="value">${total}</div></div>
    <div class="kpi good"><div class="label">Fast-Track (Box 1)</div><div class="value">${b1}</div></div>
    <div class="kpi"><div class="label">成長儲備 (Box 2+4)</div><div class="value">${growth}</div></div>
    <div class="kpi"><div class="label">深耕骨幹 (Box 5)</div><div class="value">${core}</div></div>
    <div class="kpi crit"><div class="label">PIP/輔導 (Box 9/6)</div><div class="value">${pip}</div></div>
  `;

  // 9-Box
  const counts = { 'Box 1':0,'Box 2':0,'Box 3':0,'Box 4':0,'Box 5':0,'Box 6':0,'Box 7':0,'Box 8':0,'Box 9':0 };
  list.forEach(e => counts[e.box] = (counts[e.box] || 0) + 1);

  const gridCells = [
    { box:'Box 3', name:'Box 3 · 璞玉待磨', tone:'tone-warn', pool:'橫向輪調' },
    { box:'Box 2', name:'Box 2 · 成長高潛', tone:'tone-growth', pool:'儲備池' },
    { box:'Box 1', name:'Box 1 · 頂尖之星', tone:'tone-good', pool:'優先晉升' },
    { box:'Box 6', name:'Box 6 · 瓶頸待激發', tone:'tone-crit', pool:'雙週輔導' },
    { box:'Box 5', name:'Box 5 · 核心骨幹', tone:'tone-maintain', pool:'維持深耕' },
    { box:'Box 4', name:'Box 4 · 高績效標竿', tone:'tone-growth', pool:'儲備池' },
    { box:'Box 9', name:'Box 9 · 風險淘汰', tone:'tone-crit', pool:'啟動 PIP' },
    { box:'Box 8', name:'Box 8 · 穩定貢獻', tone:'tone-maintain', pool:'維持現狀' },
    { box:'Box 7', name:'Box 7 · 資深專家', tone:'tone-maintain', pool:'技術深耕' }
  ];

  document.getElementById('boxGrid').innerHTML = gridCells.map(c => `
    <div class="cell ${c.tone}">
      <div class="name">${c.name}</div>
      <div class="count">${counts[c.box] || 0}</div>
      <div class="pool">${c.pool}</div>
    </div>
  `).join('');

  // Location
  const locMap = {};
  list.forEach(e => locMap[e.loc] = (locMap[e.loc] || 0) + 1);
  let locHtml = '<h3>地區分佈 (Location)</h3>';
  Object.keys(locMap).forEach(loc => {
    const pct = list.length ? Math.round((locMap[loc] / list.length) * 100) : 0;
    locHtml += `<div class="bar-row"><div>${loc}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div style="text-align:right;">${locMap[loc]}</div></div>`;
  });
  document.getElementById('sideMetrics').innerHTML = locHtml;

  // Table
  const getPill = (box) => {
    if (box === 'Box 1') return 'b1';
    if (box === 'Box 2' || box === 'Box 4') return 'b2';
    if (box === 'Box 3') return 'b3';
    if (box === 'Box 9' || box === 'Box 6') return 'b9';
    return 'b5';
  };
  document.getElementById('tableBody').innerHTML = list.map(e => `
    <tr>
      <td style="font-family:monospace;">${e.id}</td>
      <td><strong>${e.name}</strong></td>
      <td>${e.level}</td>
      <td>${e.loc}</td>
      <td style="font-family:monospace;">${e.perf.toFixed(2)}</td>
      <td style="font-family:monospace;">${e.pot.toFixed(2)}</td>
      <td><span class="pill ${getPill(e.box)}">${e.boxLabel}</span></td>
      <td>${e.pool}</td>
    </tr>
  `).join('');

  // Playbook
  const playbookBox = document.getElementById('playbookCards');
  playbookBox.innerHTML = '';
  list.forEach(e => {
    if (e.box === 'Box 1') {
      playbookBox.innerHTML += `
        <div class="pcard">
          <div style="font-weight:700; margin-bottom:2px;">${e.name} (${e.level} / ${e.loc}) · <span style="color:var(--series-1)">Box 1 Star</span></div>
          <div style="color:var(--text-secondary); margin-bottom:6px;">${e.notes}</div>
          <blockquote>“你在過去四季成果優異。組織已為你開展 2027 年 4 月晉升準備，我們希望為你配置策略專案，你需要什麼組織支援？”</blockquote>
        </div>
      `;
    } else if (e.box === 'Box 9') {
      const legal = complianceGuidelines[e.loc] || "請依當地法規提供改善並保留書面紀錄。";
      playbookBox.innerHTML += `
        <div class="pcard crit">
          <div style="font-weight:700; margin-bottom:2px;">${e.name} (${e.level} / ${e.loc}) · <span style="color:var(--critical)">Box 9 PIP</span></div>
          <div style="color:var(--text-secondary); margin-bottom:6px;">${e.notes}</div>
          <blockquote>“我們檢視了四季產出，數據與組織標準存在明確落差。自今日起啟動為期 2-4 週改善計畫，每週檢視指標。”</blockquote>
          <div class="jrisk"><b>合規要求：</b>${legal}</div>
        </div>
      `;
    }
  });
}

window.onload = initDashboard;
</script>
</body>
</html>
