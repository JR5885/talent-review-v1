<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Talent Review &amp; Promotion Readiness</title>
<style>
  :root{
    color-scheme: light dark;
    --surface-1: #fcfcfb; --page-plane: #f9f9f7; --text-primary: #0b0b0b; --text-secondary: #52514e;
    --text-muted: #898781; --gridline: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-3: #1baf7a; --series-6: #008300; --good: #0ca30c;
    --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --card-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7;
      --text-muted: #898781; --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --card-bg: #232322;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page-plane); color:var(--text-primary); font-family:system-ui, -apple-system, sans-serif; font-size:14px; line-height:1.5; padding-bottom:64px;}
  .wrap{max-width:1200px; margin:0 auto; padding:24px 20px 0;}
  header.top{margin-bottom:16px;}
  header.top h1{font-size:22px; margin:0 0 4px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; background:var(--gridline); color:var(--text-secondary); margin-left:8px;}

  /* 部門配置抽屜 */
  .config-box{background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:20px;}
  .config-title{font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; margin-bottom:8px;}
  .config-row{display:flex; gap:8px; margin-bottom:8px;}
  .config-row input{padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--page-plane); color:var(--text-primary); font-size:12px;}
  .config-row button{background:var(--series-1); color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600; font-size:12px;}
  .dept-tag{display:inline-flex; align-items:center; gap:6px; background:var(--border); padding:3px 10px; border-radius:20px; font-size:11px; margin-right:6px; margin-top:4px;}
  .dept-tag span{cursor:pointer; font-weight:bold; color:var(--critical);}

  /* 動態 Tab 列 */
  .tab-bar{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--gridline); padding-bottom:8px; overflow-x:auto;}
  .tab-btn{background:none; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; color:var(--text-secondary); font-weight:600; font-size:13px;}
  .tab-btn:hover{background:var(--border);}
  .tab-btn.active{background:var(--text-primary); color:var(--surface-1);}

  /* KPI 列 */
  .kpi-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px;}
  .kpi{background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px;}
  .kpi .label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  .kpi .value{font-size:26px; font-weight:700; margin-top:4px;}
  .kpi.good .value{color:var(--good);}
  .kpi.crit .value{color:var(--critical);}

  /* 9-Box Grid */
  .box-grid-wrap{display:grid; grid-template-columns: 1.4fr 1fr; gap:24px; margin-bottom:32px;}
  .box-grid{display:grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3,1fr); gap:2px; background:var(--gridline); border:1px solid var(--border); border-radius:10px; overflow:hidden; aspect-ratio: 1.35 / 1;}
  .cell{background:var(--card-bg); padding:10px 12px; position:relative; display:flex; flex-direction:column; justify-content:space-between;}
  .cell .name{font-size:11px; font-weight:600; color:var(--text-secondary);}
  .cell .count{font-size:24px; font-weight:700;}
  .cell .pct{font-size:10.5px; color:var(--text-muted);}
  .cell .pool{font-size:10.5px; margin-top:4px; font-weight:600;}
  .cell.tone-good{box-shadow:inset 3px 0 0 var(--good);}
  .cell.tone-growth{box-shadow:inset 3px 0 0 var(--series-3);}
  .cell.tone-maintain{box-shadow:inset 3px 0 0 var(--baseline);}
  .cell.tone-warn{box-shadow:inset 3px 0 0 var(--warning);}
  .cell.tone-crit{box-shadow:inset 3px 0 0 var(--critical); background: color-mix(in srgb, var(--critical) 7%, var(--card-bg));}

  .grid-with-axes{display:grid; grid-template-columns:18px 1fr; gap:6px;}
  .axis-label-y{writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; color:var(--text-muted); font-size:11px; font-weight:600;}
  .grid-x-axis{display:grid; grid-template-columns:18px 1fr; gap:6px; margin-top:4px;}
  .x-labels{display:grid; grid-template-columns:repeat(3,1fr); text-align:center; color:var(--text-muted); font-size:11px; font-weight:600;}

  /* 側邊欄與圖表 */
  .side-card{background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .side-card h3{font-size:12px; margin:0 0 10px; color:var(--text-secondary); text-transform:uppercase;}
  .bar-row{display:grid; grid-template-columns:56px 1fr 28px; align-items:center; gap:8px; margin-bottom:6px; font-size:12px;}
  .bar-track{height:8px; background:var(--gridline); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--series-1); border-radius:4px 0 0 4px;}

  /* 表格 */
  .table-tools{display:flex; gap:8px; margin-bottom:10px;}
  .table-tools select, .table-tools input{padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--card-bg); color:var(--text-primary); font-size:12px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card-bg); border-radius:10px; overflow:hidden; border:1px solid var(--border); margin-bottom:32px;}
  thead th{text-align:left; padding:9px 10px; background:var(--page-plane); color:var(--text-muted); font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--border);}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--gridline);}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700;}
  .pill.b1{background:color-mix(in srgb, var(--series-1) 18%, transparent); color:var(--series-1);}
  .pill.b2, .pill.b4{background:color-mix(in srgb, var(--series-3) 18%, transparent); color:var(--series-3);}
  .pill.b3{background:color-mix(in srgb, var(--warning) 25%, transparent); color:#8a6200;}
  .pill.b5{background:color-mix(in srgb, var(--baseline) 40%, transparent); color:var(--text-secondary);}
  .pill.b9{background:color-mix(in srgb, var(--critical) 18%, transparent); color:var(--critical);}

  /* Playbook 卡片 */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .pcard{background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .pcard.crit{border-color:color-mix(in srgb, var(--critical) 45%, var(--border));}
  .pcard blockquote{margin:4px 0; padding:8px 10px; background:var(--page-plane); border-left:3px solid var(--series-1); font-size:12px;}
  .pcard.crit blockquote{border-left-color:var(--critical);}
  .jrisk{margin-top:8px; padding:8px 10px; border-radius:6px; font-size:11.5px; background:color-mix(in srgb, var(--warning) 16%, var(--card-bg));}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Global Talent Review &amp; Promotion Readiness<span class="badge">April 2027</span></h1>
    <div style="color:var(--text-secondary); font-size:13px;">純前端 Google 試算表 CSV 串流連動 · 免用 Apps Script</div>
  </header>

  <!-- 部門 CSV 連結管理區塊 -->
  <div class="config-box">
    <div class="config-title">部門試算表 CSV 來源管理</div>
    <div class="config-row">
      <input type="text" id="newDeptName" placeholder="部門名稱 (例: Security)" style="width:180px;">
      <input type="text" id="newDeptUrl" placeholder="該分頁 CSV 發布網址 (https://docs.google.com/.../pub?gid=...&output=csv)" style="flex:1;">
      <button onclick="addDepartment()">新增 / 更新部門</button>
    </div>
    <div id="deptTagList"></div>
  </div>

  <!-- 動態 Tab 切換列 -->
  <div class="tab-bar" id="deptTabs"></div>

  <!-- KPI 摘要 -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- 九宮格與分佈 -->
  <div class="box-grid-wrap">
    <div>
      <div class="grid-with-axes">
        <div class="axis-label-y">POTENTIAL →</div>
        <div class="box-grid" id="boxGrid"></div>
      </div>
      <div class="grid-x-axis"><div></div><div class="x-labels"><div>Low</div><div>Medium</div><div>High</div></div></div>
      <div style="text-align:center; color:var(--text-muted); font-size:11px; font-weight:600; margin-top:2px;">PERFORMANCE →</div>
    </div>
    <div class="side-card" id="sideMetrics"></div>
  </div>

  <!-- 名單清單 -->
  <div class="table-tools">
    <select id="boxFilter" onchange="renderCurrentTable()">
      <option value="">所有落點 (All Boxes)</option>
      <option value="Box 1">Box 1 — Star</option>
      <option value="Box 2">Box 2 — High Potential</option>
      <option value="Box 3">Box 3 — Rough Diamond</option>
      <option value="Box 4">Box 4 — High Performer</option>
      <option value="Box 5">Box 5 — Core Player</option>
      <option value="Box 6">Box 6 — Dilemma</option>
      <option value="Box 9">Box 9 — Underperformer</option>
    </select>
    <input id="searchBox" type="text" placeholder="搜尋姓名 / ID..." oninput="renderCurrentTable()">
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>姓名</th><th>職級</th><th>地區</th><th>績效均分</th><th>加權潛力</th><th>九宮格落點</th><th>2027/04 狀態</th><th>目標職級</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Playbook -->
  <h2 style="font-size:15px; margin:0 0 12px 0;">高潛留才與 PIP 處置指引 (Playbook)</h2>
  <div class="cards" id="playbookCards"></div>
</div>

<script>
// 預設部門與你剛剛提供的試算表連結
const DEFAULT_DEPTS = {
  "Fiat": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGPWPZC10sDW7DNW_X21iuKxKNwGhmERDWdBI8RdXPBjunnRelJtf9I2PYPzSBE80EvHrgyLgyWs8C/pub?gid=1952213325&single=true&output=csv"
};

let departmentUrls = JSON.parse(localStorage.getItem('dept_csv_map')) || DEFAULT_DEPTS;
let currentDept = Object.keys(departmentUrls)[0] || '';
let currentDeptData = [];

const perfMap = { "S": 5.0, "A": 4.0, "B": 3.0, "B-": 2.0, "C": 1.0 };
const potMap = { "高": 5.0, "中": 3.0, "低": 1.5, "HIGH": 5.0, "MED": 3.0, "LOW": 1.5 };

const complianceGuidelines = {
  TW: "【台灣 勞基法】依第 11 條第 5 款最後手段性原則，需實施 2-4 週 PIP 明確量化指標並留存輔導轉崗紀錄，始得資遣。",
  SG: "【新加坡 TAFEP】2-4 週 PIP 需有每週檢視紀錄，未達標給予法定預告期或代通知金，防範 ECT 申訴。",
  MY: "【馬來西亞 工業關係法】高風險！需寄送至少兩次正式書面警告信（Warning Letter）並保留輔導日誌。",
  US: "【美國 At-Will】以書面 PIP 載明客觀是非標準，作為抗辯 Title VII / ADEA 之佐證。",
  EU: "【歐盟 嚴格保護】2-4 週改善極難被法院採納，強烈建議採協議離職（Mutual Separation）給付補償金。",
  UAE: "【阿聯酋 勞工法】需有明確業績考核記錄，並提供至少 30 天法定預告期。",
  IN: "【印度 勞動法】需保留書面輔導記錄、合理改善期，並依約給予通知工資折算。"
};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^[\uFEFF\s]+|[\s]+$/g, ''));
  return lines.slice(1).map(line => {
    const values = line.split(',').map(v => v.trim());
    let obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

function processRow(rowObj) {
  const q1 = perfMap[String(rowObj.Q1).trim().toUpperCase()] || parseFloat(rowObj.Q1) || 0;
  const q2 = perfMap[String(rowObj.Q2).trim().toUpperCase()] || parseFloat(rowObj.Q2) || 0;
  const q3 = perfMap[String(rowObj.Q3).trim().toUpperCase()] || parseFloat(rowObj.Q3) || 0;
  const q4 = perfMap[String(rowObj.Q4).trim().toUpperCase()] || parseFloat(rowObj.Q4) || 0;
  const perf = (q1 + q2 + q3 + q4) / 4;

  const leadPotRaw = rowObj.Manager_Pot || rowObj.Lead_Pot || "中";
  const headPotRaw = rowObj.HRBP_Pot || rowObj.Head_Pot || "中";
  const leadPot = potMap[String(leadPotRaw).trim()] || parseFloat(leadPotRaw) || 3.0;
  const headPot = potMap[String(headPotRaw).trim()] || parseFloat(headPotRaw) || 3.0;
  const pot = (leadPot * 0.7) + (headPot * 0.3);

  let perfTier = perf >= 4.2 ? 'High' : (perf >= 3.0 ? 'Med' : 'Low');
  let potTier = pot >= 4.0 ? 'High' : (pot >= 2.8 ? 'Med' : 'Low');
  let box = '', boxLabel = '', pool = '', target = rowObj.Current_Level || '';

  if (perfTier === 'High' && potTier === 'High') {
    box = 'Box 1'; boxLabel = 'Box 1 (Star)'; pool = 'Fast-Track 優先晉升';
    target = target.startsWith('L4') ? 'M1 或 L5' : (target.startsWith('M') ? `M${parseInt(target[1])+1}` : `L${parseInt(target[1])+1}`);
  } else if (perfTier === 'Med' && potTier === 'High') {
    box = 'Box 2'; boxLabel = 'Box 2 (High Potential)'; pool = 'Succession 儲備 (6-12mo)'; target = `Ready for Next Level`;
  } else if (perfTier === 'Low' && potTier === 'High') {
    box = 'Box 3'; boxLabel = 'Box 3 (Rough Diamond)'; pool = '關注調崗 / 潛力激發'; target = '橫向輪調';
  } else if (perfTier === 'High' && potTier === 'Med') {
    box = 'Box 4'; boxLabel = 'Box 4 (High Performer)'; pool = 'Succession 儲備 (6-12mo)'; target = `Ready for Next Level`;
  } else if (perfTier === 'Med' && potTier === 'Med') {
    box = 'Box 5'; boxLabel = 'Box 5 (Core Player)'; pool = '維持現職深耕'; target = target;
  } else if (perfTier === 'Low' && potTier === 'Med') {
    box = 'Box 6'; boxLabel = 'Box 6 (Dilemma)'; pool = '限期觀察 / 雙週輔導'; target = '待輔導結果';
  } else if (perfTier === 'High' && potTier === 'Low') {
    box = 'Box 7'; boxLabel = 'Box 7 (Solid Pro)'; pool = '資深專家 (不轉管理)'; target = target;
  } else if (perfTier === 'Med' && potTier === 'Low') {
    box = 'Box 8'; boxLabel = 'Box 8 (Effective)'; pool = '標準維持者'; target = target;
  } else {
    box = 'Box 9'; boxLabel = 'Box 9 (Underperformer)'; pool = '啟動 2-4 週 PIP'; target = 'Pending PIP';
  }

  return {
    id: rowObj.Employee_ID || '',
    name: rowObj.Name || '',
    level: rowObj.Current_Level || '',
    loc: (rowObj.Location || rowObj.Region || '').toUpperCase(),
    perf: Number(perf.toFixed(2)),
    pot: Number(pot.toFixed(2)),
    box, boxLabel, pool, target,
    notes: rowObj.Notes || ''
  };
}

function loadCurrentDepartment() {
  if (!currentDept || !departmentUrls[currentDept]) return;
  const url = departmentUrls[currentDept];

  fetch(url)
    .then(res => {
      if(!res.ok) throw new Error("讀取失敗，請確認該分頁已發布為 CSV");
      return res.text();
    })
    .then(csv => {
      currentDeptData = parseCSV(csv).map(processRow);
      renderUI();
    })
    .catch(err => {
      alert(`載入 ${currentDept} 失敗: ` + err.message);
    });
}

function renderUI() {
  renderTabs();
  renderTags();
  renderKPIs();
  renderGrid();
  renderSide();
  renderCurrentTable();
  renderPlaybook();
}

function renderTabs() {
  const container = document.getElementById('deptTabs');
  container.innerHTML = '';
  Object.keys(departmentUrls).forEach(dept => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${dept === currentDept ? 'active' : ''}`;
    btn.innerText = dept;
    btn.onclick = () => {
      currentDept = dept;
      loadCurrentDepartment();
    };
    container.appendChild(btn);
  });
}

function renderTags() {
  const container = document.getElementById('deptTagList');
  container.innerHTML = '';
  Object.keys(departmentUrls).forEach(dept => {
    const tag = document.createElement('span');
    tag.className = 'dept-tag';
    tag.innerHTML = `${dept} <span onclick="removeDept('${dept}')">×</span>`;
    container.appendChild(tag);
  });
}

function addDepartment() {
  const name = document.getElementById('newDeptName').value.trim();
  const url = document.getElementById('newDeptUrl').value.trim();
  if (!name || !url) { alert("請輸入部門名稱與對應的 CSV 發布網址"); return; }
  departmentUrls[name] = url;
  localStorage.setItem('dept_csv_map', JSON.stringify(departmentUrls));
  currentDept = name;
  document.getElementById('newDeptName').value = '';
  document.getElementById('newDeptUrl').value = '';
  loadCurrentDepartment();
}

function removeDept(name) {
  if (confirm(`確定移除 ${name} 部門嗎？`)) {
    delete departmentUrls[name];
    localStorage.setItem('dept_csv_map', JSON.stringify(departmentUrls));
    currentDept = Object.keys(departmentUrls)[0] || '';
    if (currentDept) loadCurrentDepartment();
    else {
      currentDeptData = [];
      renderUI();
    }
  }
}

function renderKPIs() {
  const list = currentDeptData;
  const total = list.length;
  const b1 = list.filter(e => e.box === 'Box 1').length;
  const growth = list.filter(e => e.box === 'Box 2' || e.box === 'Box 4').length;
  const maintain = list.filter(e => e.box === 'Box 5' || e.box === 'Box 7' || e.box === 'Box 8').length;
  const pip = list.filter(e => e.box === 'Box 9' || e.box === 'Box 6').length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi"><div class="label">評估總人數</div><div class="value">${total}</div></div>
    <div class="kpi good"><div class="label">Fast-Track (Box 1)</div><div class="value">${b1}</div></div>
    <div class="kpi"><div class="label">成長儲備池 (Box 2+4)</div><div class="value">${growth}</div></div>
    <div class="kpi"><div class="label">深耕骨幹 (Box 5)</div><div class="value">${maintain}</div></div>
    <div class="kpi crit"><div class="label">PIP/輔導池 (Box 9/6)</div><div class="value">${pip}</div></div>
  `;
}

function renderGrid() {
  const list = currentDeptData;
  const counts = { 'Box 1':0, 'Box 2':0, 'Box 3':0, 'Box 4':0, 'Box 5':0, 'Box 6':0, 'Box 7':0, 'Box 8':0, 'Box 9':0 };
  list.forEach(e => counts[e.box] = (counts[e.box] || 0) + 1);

  const gridCells = [
    { box:'Box 3', name:'Box 3 · 璞玉待磨', tone:'tone-warn', pool:'橫向輪調' },
    { box:'Box 2', name:'Box 2 · 成長高潛', tone:'tone-growth', pool:'儲備池' },
    { box:'Box 1', name:'Box 1 · 頂尖之星', tone:'tone-good', pool:'優先晉升' },
    { box:'Box 6', name:'Box 6 · 瓶頸待激發', tone:'tone-crit', pool:'雙週輔導' },
    { box:'Box 5', name:'Box 5 · 核心骨幹', tone:'tone-maintain', pool:'維持深耕' },
    { box:'Box 4', name:'Box 4 · 高績效標竿', tone:'tone-growth', pool:'儲備池' },
    { box:'Box 9', name:'Box 9 · 風險淘汰', tone:'tone-crit', pool:'啟動 PIP' },
    { box:'Box 8', name:'Box 8 · 穩定貢獻', tone:'tone-maintain', pool:'維持現狀' },
    { box:'Box 7', name:'Box 7 · 資深專家', tone:'tone-maintain', pool:'技術深耕' }
  ];

  document.getElementById('boxGrid').innerHTML = gridCells.map(c => `
    <div class="cell ${c.tone}">
      <div class="name">${c.name}</div>
      <div>
        <div class="count">${counts[c.box] || 0}</div>
        <div class="pct">${list.length ? Math.round(((counts[c.box] || 0) / list.length)*100) : 0}%</div>
      </div>
      <div class="pool">${c.pool}</div>
    </div>
  `).join('');
}

function renderSide() {
  const list = currentDeptData;
  const locMap = {};
  list.forEach(e => locMap[e.loc] = (locMap[e.loc] || 0) + 1);
  
  let locHtml = '<h3>地區分佈 (Location)</h3>';
  Object.keys(locMap).forEach(loc => {
    const pct = list.length ? Math.round((locMap[loc] / list.length) * 100) : 0;
    locHtml += `
      <div class="bar-row">
        <div>${loc}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div style="text-align:right; color:var(--text-muted);">${locMap[loc]}</div>
      </div>
    `;
  });
  document.getElementById('sideMetrics').innerHTML = locHtml;
}

function renderCurrentTable() {
  const list = currentDeptData;
  const boxFilter = document.getElementById('boxFilter').value;
  const query = document.getElementById('searchBox').value.toLowerCase().trim();

  const filtered = list.filter(e => {
    return (!boxFilter || e.box === boxFilter) &&
           (!query || e.name.toLowerCase().includes(query) || e.id.toLowerCase().includes(query));
  });

  const getPill = (box) => {
    if (box === 'Box 1') return 'b1';
    if (box === 'Box 2' || box === 'Box 4') return 'b2';
    if (box === 'Box 3') return 'b3';
    if (box === 'Box 9' || box === 'Box 6') return 'b9';
    return 'b5';
  };

  document.getElementById('tableBody').innerHTML = filtered.map(e => `
    <tr>
      <td style="font-family:monospace;">${e.id}</td>
      <td><strong>${e.name}</strong></td>
      <td>${e.level}</td>
      <td>${e.loc}</td>
      <td style="font-family:monospace;">${e.perf.toFixed(2)}</td>
      <td style="font-family:monospace;">${e.pot.toFixed(2)}</td>
      <td><span class="pill ${getPill(e.box)}">${e.boxLabel}</span></td>
      <td>${e.pool}</td>
      <td>${e.target}</td>
    </tr>
  `).join('');
}

function renderPlaybook() {
  const container = document.getElementById('playbookCards');
  container.innerHTML = '';
  const list = currentDeptData;

  list.forEach(e => {
    if (e.box === 'Box 1') {
      container.innerHTML += `
        <div class="pcard">
          <div style="font-weight:700; margin-bottom:4px;">${e.name} (${e.level} / ${e.loc}) · <span style="color:var(--series-1)">Box 1 Star</span></div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">${e.notes}</div>
          <blockquote>“你在過去四季成果優異。組織已為你開展 2027 年 4 月晉升準備，我們希望為你配置策略專案，你希望在哪個維度獲得組織支援？”</blockquote>
        </div>
      `;
    } else if (e.box === 'Box 9') {
      const legal = complianceGuidelines[e.loc] || "請依當地勞動法規實施改善並保留完整書面佐證。";
      container.innerHTML += `
        <div class="pcard crit">
          <div style="font-weight:700; margin-bottom:4px;">${e.name} (${e.level} / ${e.loc}) · <span style="color:var(--critical)">Box 9 PIP</span></div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">${e.notes}</div>
          <blockquote>“我們檢視了四季產出，數據與組織標準存在明確落差。自今日起啟動為期 2-4 週改善計畫，每週檢核具體指標。”</blockquote>
          <div class="jrisk"><b>合規提醒：</b>${legal}</div>
        </div>
      `;
    }
  });
}

window.onload = loadCurrentDepartment;
</script>
</body>
</html>
